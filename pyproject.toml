    "bioio-tiff-glob>=1.2.0",
    "bioio-tifffile>=1.3.0",
    "dask[complete]>=2025.10.0",
    "datashader>=0.19.0",
    "fastexcel>=0.16.0",
    "hvplot>=0.12.2",
    "marimo>=0.15.3",
    "pillow>=12.0.0",
    "polars>=1.34.0",
    "tqdm>=4.67.1",
    "user-agents>=2.2.0",
